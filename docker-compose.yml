version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:14
    container_name: installsure-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: installsure
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Redis Cache
  redis:
    image: redis:7
    container_name: installsure-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Backend API (FastAPI)
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: installsure-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/installsure
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change_me
      FILE_STORAGE: local
      FILE_STORAGE_BASE: ../uploads
      FACTUAL_REQUIRES_RETRIEVAL: "true"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # BIM Worker (Python RQ Worker)
  bim:
    build:
      context: .
      dockerfile: infra/docker/bim.Dockerfile
    container_name: installsure-bim
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/installsure
      REDIS_URL: redis://redis:6379/0
      WORKER_CONCURRENCY: "2"
    env_file:
      - ./bim/.env
    volumes:
      - ./bim:/app
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend (React + Vite)
  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    container_name: installsure-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads:
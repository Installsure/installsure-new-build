name: CI - Test, Lint, and Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'
  PYTHON_VERSION: '3.12'

jobs:
  # Backend Node.js Tests
  backend-test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: installsure_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/installsure_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: npm run test:coverage

      - name: Check coverage threshold (≥80%)
        working-directory: backend
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            coverage=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
            echo "Coverage: ${coverage}%"
            if (( $(echo "$coverage < 80" | bc -l) )); then
              echo "❌ Coverage is below 80%"
              exit 1
            else
              echo "✅ Coverage meets threshold (≥80%)"
            fi
          fi

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          directory: backend/coverage
          flags: backend

  # Frontend Tests
  frontend-test:
    name: Frontend Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests with coverage
        working-directory: frontend
        run: npm run test:coverage || true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          directory: frontend/coverage
          flags: frontend

  # BIM Worker Tests
  bim-test:
    name: BIM Worker Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: bim/requirements.txt

      - name: Install dependencies
        working-directory: bim
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests with coverage
        working-directory: bim
        env:
          REDIS_URL: redis://localhost:6379
        run: pytest --cov=. --cov-report=xml --cov-report=html -v

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          directory: bim
          flags: bim

  # Linting
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Node dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Install Python linters
        run: |
          pip install black ruff isort mypy bandit

      - name: Lint Backend (Node.js)
        working-directory: backend
        run: npm run lint

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

      - name: Lint BIM Worker (Python)
        working-directory: bim
        run: |
          ruff check .
          black --check .
          isort --check-only .

      - name: Type check BIM Worker
        working-directory: bim
        run: mypy . --ignore-missing-imports || true

  # Security Scanning
  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit security scan (Python)
        run: |
          bandit -r backend/ bim/ -ll -f json -o bandit-report.json || true
          bandit -r backend/ bim/ -ll

      - name: npm audit (Backend)
        working-directory: backend
        run: npm audit --audit-level=moderate || true

      - name: npm audit (Frontend)
        working-directory: frontend
        run: npm audit --audit-level=moderate || true

      - name: Upload Bandit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  # OWASP ASVS Verification
  owasp-asvs-check:
    name: OWASP ASVS 5.0 Checklist Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify OWASP ASVS checklist exists
        run: |
          if [ ! -f docs/security/OWASP_ASVS_5.0_Checklist.csv ]; then
            echo "❌ OWASP ASVS checklist not found"
            exit 1
          fi
          echo "✅ OWASP ASVS checklist found"

      - name: Check implementation status
        run: |
          total=$(tail -n +2 docs/security/OWASP_ASVS_5.0_Checklist.csv | wc -l)
          implemented=$(grep -c "✅ Implemented" docs/security/OWASP_ASVS_5.0_Checklist.csv || true)
          percentage=$((implemented * 100 / total))
          echo "OWASP ASVS 5.0 Implementation: ${implemented}/${total} (${percentage}%)"
          if [ $percentage -lt 70 ]; then
            echo "⚠️ ASVS implementation below 70%"
            exit 1
          fi
          echo "✅ ASVS implementation meets threshold"

  # Build check
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, bim-test, lint]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            backend/dist
            frontend/dist
          retention-days: 7

  # All checks summary
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, bim-test, lint, security, owasp-asvs-check, build]
    if: success()

    steps:
      - name: CI Passed
        run: echo "✅ All CI checks passed!"

# Docker Compose configuration for LLM/RAG/Vector services
# Usage: docker-compose -f docker-compose.yml -f infra/compose/docker-compose.llm.yml up

version: '3.9'

services:
  # PostgreSQL with pgvector extension for vector storage
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: installsure
      POSTGRES_USER: installsure
      POSTGRES_PASSWORD: dev_password
    command: postgres -c shared_preload_libraries=vector
    volumes:
      - postgres_vector_data:/var/lib/postgresql/data

  # Optional: Dedicated vector search service (Qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: installsure-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    profiles:
      - qdrant

  # Optional: Weaviate vector database
  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: installsure-weaviate
    ports:
      - "8088:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'
    volumes:
      - weaviate_data:/var/lib/weaviate
    profiles:
      - weaviate

  # Embeddings service (optional local embeddings)
  embeddings:
    image: huggingface/transformers-embeddings:latest
    container_name: installsure-embeddings
    ports:
      - "8090:8000"
    environment:
      MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
    profiles:
      - local-embeddings

volumes:
  postgres_vector_data:
  qdrant_data:
  weaviate_data:
